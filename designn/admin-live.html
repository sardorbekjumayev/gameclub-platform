<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web — Club admin live panel</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Manrope',sans-serif;background:#0E0F13}</style>
<style>html{background:#0E0F13}body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 1280px; height: 800px; background: #0E0F13; color: #EDEEF2; display: flex">
<div style="width: 220px; flex-shrink: 0; padding: 24px 16px; border-right: 1px solid #262A36; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #A3A9BA">
<div style="font: 700 20px 'Chakra Petch'; color: #C6FF3D; padding: 0 12px 16px">[LOGO]</div>
<div style="padding: 12px; border-radius: 10px; background: #1E212B; color: #EDEEF2; font-weight: 700">Live panel</div>
<div style="padding: 12px">Bronlar</div><div style="padding: 12px">Sessiyalar</div><div style="padding: 12px">Mijozlar</div><div style="padding: 12px">To'lovlar</div><div style="padding: 12px">Tariflar</div><div style="padding: 12px">Hisobotlar</div>
</div>
<div style="flex-grow: 1; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="font: 700 26px 'Chakra Petch'">Chilonzor filiali</div><button style="height: 46px; padding: 0 22px; border: 0; border-radius: 12px; background: #C6FF3D; color: #0E0F13; font: 700 14px 'Manrope'">Walk-in qo'shish</button></div>
<div style="display: flex; gap: 16px">
<div style="flex: 1; padding: 18px; border-radius: 16px; background: #171922"><div style="color: #A3A9BA; font-size: 13px">Bugungi tushum</div><div style="font: 700 24px 'Chakra Petch'; margin-top: 6px">[SUMMA]</div></div>
<div style="flex: 1; padding: 18px; border-radius: 16px; background: #171922"><div style="color: #A3A9BA; font-size: 13px">Faol sessiyalar</div><div style="font: 700 24px 'Chakra Petch'; margin-top: 6px">[N]</div></div>
<div style="flex: 1; padding: 18px; border-radius: 16px; background: #171922"><div style="color: #A3A9BA; font-size: 13px">Bo'sh PC</div><div style="font: 700 24px 'Chakra Petch'; margin-top: 6px; color: #C6FF3D">[N]</div></div>
<div style="flex: 1; padding: 18px; border-radius: 16px; background: #171922"><div style="color: #A3A9BA; font-size: 13px">Yaqin bronlar</div><div style="font: 700 24px 'Chakra Petch'; margin-top: 6px">[N]</div></div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px">
<div style="padding: 16px; border-radius: 16px; background: #171922; border: 1px solid #C6FF3D"><div style="display: flex; justify-content: space-between"><b>PC-01</b><span style="color: #C6FF3D; font-size: 13px; font-weight: 700">Bo'sh</span></div><button style="margin-top: 26px; width: 100%; height: 40px; border: 1px solid #2B3040; border-radius: 10px; background: transparent; color: #EDEEF2; font: 600 13px 'Manrope'">Sessiya boshlash</button></div>
<div style="padding: 16px; border-radius: 16px; background: #171922; border: 1px solid #FF7A7A"><div style="display: flex; justify-content: space-between"><b>PC-02</b><span style="color: #FF9C9C; font-size: 13px; font-weight: 700">Band</span></div><div style="margin-top: 6px; font-size: 13px; color: #A3A9BA">[Mijoz ismi]</div><div style="font: 700 20px 'Chakra Petch'; margin-top: 4px">01:23:45</div></div>
<div style="padding: 16px; border-radius: 16px; background: #171922; border: 1px solid #FFB020"><div style="display: flex; justify-content: space-between"><b>PC-03</b><span style="color: #FFB020; font-size: 13px; font-weight: 700">Bron</span></div><div style="margin-top: 6px; font-size: 13px; color: #A3A9BA">[Mijoz ismi]</div><div style="font-size: 14px; margin-top: 4px">Boshlanishi 19:30</div></div>
<div style="padding: 16px; border-radius: 16px; background: #171922; border: 1px solid #2B3040; opacity: 0.7"><div style="display: flex; justify-content: space-between"><b>PC-04</b><span style="color: #A3A9BA; font-size: 13px; font-weight: 700">Ta'mirda</span></div></div>
</div>
</div>
</div>
</body>
</html>
