name: CI
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: gc, POSTGRES_PASSWORD: gc, POSTGRES_DB: gameclub }
        ports: ["55432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp apps/api/.env.example apps/api/.env
      - run: pnpm --filter @gc/api exec prisma generate
      # e2e testlar haqiqiy bazada: sxema + RBAC/super admin/tarif rejalari
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
